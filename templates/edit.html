
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
</head>
<body>
    <h1>Edit Student Details</h1>

    <form method="POST">
        <label>Student ID</label><br>
        <input type="text" value="{{ student.student_id }}" readonly><br><br>

        <label>Name</label><br>
        <input type="text" name="name" value="{{ student.name }}" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" value="{{ student.email }}" required><br><br>

        <label>GPA (0–10)</label><br>
        <input type="number" name="gpa" min="0" max="10" step="0.1"
               value="{{ student.gpa }}" required><br><br>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('home') }}">Cancel</a>
    </form>
</body>
</html>
